[package]
name = "claude-tray"
version = "0.1.0"
edition = "2024"
description = "A tray applet showing which Claude Code sessions are waiting on you"
license = "MIT"
repository = "https://github.com/lorenzolfm/claude-tray"

[dependencies]
# What a status means, what a row is called, how rows sort, and how the jump
# reaches a pane. luneta's agents tab is the standard and this crate is that
# table, so the applet links it rather than holding a second copy: a vocabulary
# that differs between two surfaces is worse than no vocabulary.
#
# The launcher extension reaches the same code through the `claude-nav` binary
# on PATH. One place decides; two surfaces render.
claude-nav = { git = "https://github.com/lorenzolfm/claude-nav" }
# `blocking` adds to the crate and does not replace a part of it: it puts a
# synchronous interface over the async tray. A build without the default `tokio`
# feature fails, because zbus then uses an `async_io` module that is not built.
ksni = { version = "0.3", features = ["blocking"] }
ab_glyph = "0.2"

[profile.release]
strip = true
